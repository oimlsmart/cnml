<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Inter, system-ui, sans-serif" font-size="13" fill="currentColor">
  <title>CNML PKI System Architecture</title>
  <desc>Three-layer architecture: offline CA operations, static CDN publication, browser verification</desc>
  <defs>
    <style>
      .offline  { fill: #fef2f2; stroke: #dc2626; }
      .cdn      { fill: #eff6ff; stroke: #2563eb; }
      .browser  { fill: #f0fdf4; stroke: #15803d; }
      .arrow    { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#a2); }
      .dashed   { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
      .label    { fill: #0f172a; font-weight: 600; }
      .muted    { fill: #64748b; font-size: 11px; }
      .small    { fill: #6b7a92; font-size: 10px; }
      .section  { fill: #004996; font-size: 14px; font-weight: 700; }
    </style>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#004996">CNML PKI System Architecture</text>
  <text x="450" y="50" text-anchor="middle" class="muted">Three layers: offline signing → static publication → browser verification</text>

  <!-- ─── LAYER 1: OFFLINE ─────────────────────────────────── -->
  <text x="180" y="85" text-anchor="middle" class="section">Offline</text>
  <text x="180" y="102" text-anchor="middle" class="muted">Air-gapped machines · USB only</text>

  <rect x="50" y="115" width="260" height="140" rx="10" class="offline"/>
  <text x="180" y="140" text-anchor="middle" class="label">BIML Root CA Machine</text>
  <text x="180" y="158" text-anchor="middle" class="small">Holds Root CA private key</text>
  <text x="180" y="173" text-anchor="middle" class="small">Signs intermediate CA certs</text>
  <text x="180" y="188" text-anchor="middle" class="small">Signs root-level CRLs</text>
  <text x="180" y="203" text-anchor="middle" class="small">Generates trust-anchor manifest</text>
  <text x="180" y="225" text-anchor="middle" class="small">→ USB → git push → CDN</text>
  <text x="180" y="242" text-anchor="middle" class="small">Frequency: ~1-2× per year</text>

  <rect x="50" y="280" width="260" height="120" rx="10" class="offline"/>
  <text x="180" y="305" text-anchor="middle" class="label">IA CA Machine (per authority)</text>
  <text x="180" y="323" text-anchor="middle" class="small">Holds Intermediate CA private key</text>
  <text x="180" y="338" text-anchor="middle" class="small">Signs signer end-entity certs</text>
  <text x="180" y="353" text-anchor="middle" class="small">Signs IA-level CRLs</text>
  <text x="180" y="375" text-anchor="middle" class="small">→ USB → git push → CDN</text>
  <text x="180" y="392" text-anchor="middle" class="small">Frequency: monthly / on-demand</text>

  <!-- ─── LAYER 2: CDN ─────────────────────────────────────── -->
  <text x="480" y="85" text-anchor="middle" class="section">Static CDN</text>
  <text x="480" y="102" text-anchor="middle" class="muted">Git repository → public static hosting</text>

  <rect x="350" y="115" width="260" height="285" rx="10" class="cdn"/>
  <text x="480" y="140" text-anchor="middle" class="label">PKI Artifacts Repository</text>
  <text x="480" y="160" text-anchor="middle" class="small">trust-anchors.json</text>
  <text x="480" y="175" text-anchor="middle" class="small">roots/oiml-root-ca.crt</text>
  <text x="480" y="190" text-anchor="middle" class="small">intermediates/{issuer}.crt</text>
  <text x="480" y="205" text-anchor="middle" class="small">crls/{issuer}.crl</text>
  <text x="480" y="220" text-anchor="middle" class="small">certs-index.json</text>
  <text x="480" y="235" text-anchor="middle" class="small">tsa-keys/oiml.pub.pem</text>
  <line x1="370" y1="250" x2="590" y2="250" stroke="#cbd5e1"/>
  <text x="480" y="270" text-anchor="middle" class="small">All files are signed and</text>
  <text x="480" y="285" text-anchor="middle" class="small">verifiable by anyone</text>
  <text x="480" y="310" text-anchor="middle" class="small">Zero infrastructure</text>
  <text x="480" y="325" text-anchor="middle" class="small">Free static hosting</text>
  <text x="480" y="340" text-anchor="middle" class="small">CORS-enabled</text>
  <text x="480" y="365" text-anchor="middle" class="small">Updates via git commit</text>
  <text x="480" y="380" text-anchor="middle" class="small">(the merge IS publication)</text>

  <!-- ─── LAYER 3: BROWSER ─────────────────────────────────── -->
  <text x="780" y="85" text-anchor="middle" class="section">Browser</text>
  <text x="780" y="102" text-anchor="middle" class="muted">Static web app · per-audience builds</text>

  <rect x="650" y="115" width="220" height="90" rx="10" class="browser"/>
  <text x="760" y="140" text-anchor="middle" class="label">Signer</text>
  <text x="760" y="158" text-anchor="middle" class="small">Generate Ed25519+ML-DSA key</text>
  <text x="760" y="173" text-anchor="middle" class="small">Create CSR · sign CNMLs</text>
  <text x="760" y="188" text-anchor="middle" class="small">Daily use</text>

  <rect x="650" y="230" width="220" height="75" rx="10" class="browser"/>
  <text x="760" y="255" text-anchor="middle" class="label">Verifier</text>
  <text x="760" y="273" text-anchor="middle" class="small">Upload .cnml.xml</text>
  <text x="760" y="288" text-anchor="middle" class="small">Full chain + CRL + status check</text>

  <rect x="650" y="330" width="220" height="65" rx="10" class="browser"/>
  <text x="760" y="355" text-anchor="middle" class="label">Manufacturer / Public</text>
  <text x="760" y="373" text-anchor="middle" class="small">Verify only · no keys</text>

  <!-- ─── ARROWS ───────────────────────────────────────────── -->
  <path d="M 310 200 Q 330 200 350 180" class="arrow"/>
  <text x="328" y="190" text-anchor="middle" class="small">USB→git</text>

  <path d="M 310 350 Q 330 350 350 300" class="arrow"/>
  <text x="328" y="320" text-anchor="middle" class="small">USB→git</text>

  <path d="M 610 180 L 650 160" class="arrow"/>
  <text x="630" y="160" text-anchor="middle" class="small">fetch</text>

  <path d="M 610 250 L 650 265" class="arrow"/>
  <text x="630" y="240" text-anchor="middle" class="small">fetch</text>

  <path d="M 610 330 L 650 355" class="arrow"/>
  <text x="630" y="335" text-anchor="middle" class="small">fetch</text>

  <!-- ─── BOTTOM: VERIFICATION DETAIL ──────────────────────── -->
  <rect x="50" y="425" width="820" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="450" y="450" text-anchor="middle" class="label">Browser Verification (7 steps)</text>

  <rect x="70" y="465" width="100" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="120" y="484" text-anchor="middle" class="small">1. XML valid?</text>

  <rect x="180" y="465" width="100" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="230" y="484" text-anchor="middle" class="small">2. Schema?</text>

  <rect x="290" y="465" width="100" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="340" y="484" text-anchor="middle" class="small">3. Cert chain?</text>

  <rect x="400" y="465" width="100" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="450" y="484" text-anchor="middle" class="small">4. Not expired?</text>

  <rect x="510" y="465" width="100" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="560" y="484" text-anchor="middle" class="small">5. Not revoked?</text>

  <rect x="620" y="465" width="100" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="670" y="484" text-anchor="middle" class="small">6. Not withdrawn?</text>

  <rect x="730" y="465" width="120" height="30" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="790" y="484" text-anchor="middle" class="small">7. Sig valid?</text>

  <text x="450" y="520" text-anchor="middle" class="muted">Steps 3-6 fetch artifacts from the CDN (cached 24h). Step 7 verifies the dual Ed25519 + ML-DSA-65 XMLDSig.</text>
  <text x="450" y="540" text-anchor="middle" class="muted">Browser also checks (optional) OpenTimestamps proof against the Bitcoin blockchain.</text>
</svg>
