<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, system-ui, sans-serif" font-size="13" fill="currentColor">
  <title>Certificate Chain Verification</title>
  <desc>How a verifier builds and validates the X.509 chain from signer cert through intermediate CA to trusted root</desc>
  <defs>
    <style>
      .signer    { fill: #f0fdf4; stroke: #15803d; }
      .ia        { fill: #eff6ff; stroke: #2563eb; }
      .root      { fill: #fef2f2; stroke: #dc2626; }
      .arrow     { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#a6); }
      .label     { fill: #0f172a; font-weight: 600; }
      .muted     { fill: #64748b; font-size: 11px; }
      .small     { fill: #6b7a92; font-size: 10px; }
      .check     { fill: #15803d; font-weight: 700; }
      .cross     { fill: #dc2626; font-weight: 700; }
    </style>
    <marker id="a6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#004996">Certificate Chain Verification</text>
  <text x="450" y="50" text-anchor="middle" class="muted">The browser walks the chain from the CNML's embedded cert up to a trusted root</text>

  <!-- Step 1: Extract from CNML -->
  <rect x="50" y="75" width="250" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="175" y="100" text-anchor="middle" class="small">1. Extract signer cert from &lt;ds:X509Certificate&gt; in CNML</text>

  <!-- Chain boxes -->
  <!-- Signer cert -->
  <rect x="50" y="140" width="250" height="80" rx="8" class="signer"/>
  <text x="175" y="162" text-anchor="middle" class="label">Signer Cert (end-entity)</text>
  <text x="175" y="180" text-anchor="middle" class="small">CN=M.Ph.D. Schmidt</text>
  <text x="175" y="195" text-anchor="middle" class="small">O=NMi Certin B.V.</text>
  <text x="175" y="210" text-anchor="middle" class="small">Serial: 4A2B... · Validity: 2026-2028</text>

  <path d="M 175 115 L 175 140" class="arrow"/>

  <!-- Chain link 1 -->
  <text x="175" y="240" text-anchor="middle" class="small">↑ Signed by</text>

  <!-- IA cert -->
  <rect x="50" y="255" width="250" height="70" rx="8" class="ia"/>
  <text x="175" y="277" text-anchor="middle" class="label">NMi Intermediate CA Cert</text>
  <text x="175" y="295" text-anchor="middle" class="small">CN=NMi OIML-CS CA</text>
  <text x="175" y="310" text-anchor="middle" class="small">CA:TRUE · pathlen:0</text>
  <text x="175" y="325" text-anchor="middle" class="small">Validity: 2026-2036</text>

  <!-- Chain link 2 -->
  <text x="175" y="345" text-anchor="middle" class="small">↑ Signed by</text>

  <!-- Root cert -->
  <rect x="50" y="360" width="250" height="65" rx="8" class="root"/>
  <text x="175" y="382" text-anchor="middle" class="label">OIML Root CA Cert</text>
  <text x="175" y="400" text-anchor="middle" class="small">CN=OIML Root CA</text>
  <text x="175" y="415" text-anchor="middle" class="small">CA:TRUE · Self-signed · Trust anchor</text>

  <!-- RIGHT: Verification checks -->
  <rect x="370" y="140" width="490" height="285" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="615" y="165" text-anchor="middle" class="label">Verification Checks (per level)</text>

  <!-- Signer checks -->
  <text x="395" y="195" class="check">✓</text>
  <text x="415" y="195" class="small">Signature on signer cert verifies with IA public key</text>

  <text x="395" y="215" class="check">✓</text>
  <text x="415" y="215" class="small">BasicConstraints: CA:FALSE (it's an end-entity)</text>

  <text x="395" y="235" class="check">✓</text>
  <text x="415" y="235" class="small">KeyUsage: digitalSignature (can sign CNMLs)</text>

  <text x="395" y="255" class="check">✓</text>
  <text x="415" y="255" class="small">Validity: notBefore ≤ now ≤ notAfter</text>

  <text x="395" y="275" class="check">✓</text>
  <text x="415" y="275" class="small">Serial NOT in IA's CRL (key not revoked)</text>

  <line x1="395" y1="290" x2="830" y2="290" stroke="#e2e8f0"/>

  <!-- IA checks -->
  <text x="395" y="310" class="check">✓</text>
  <text x="415" y="310" class="small">Signature on IA cert verifies with root public key</text>

  <text x="395" y="330" class="check">✓</text>
  <text x="415" y="330" class="small">BasicConstraints: CA:TRUE, pathlen:0</text>

  <text x="395" y="350" class="check">✓</text>
  <text x="415" y="350" class="small">KeyUsage: keyCertSign + cRLSign</text>

  <text x="395" y="370" class="check">✓</text>
  <text x="415" y="370" class="small">Validity: not expired</text>

  <line x1="395" y1="385" x2="830" y2="385" stroke="#e2e8f0"/>

  <!-- Root check -->
  <text x="395" y="405" class="check">✓</text>
  <text x="415" y="405" class="small">Root fingerprint in trust-anchors.json (fetched from CDN)</text>

  <!-- Arrows from chain to checks -->
  <path d="M 300 180 L 370 180" class="arrow" stroke-dasharray="4 3"/>
  <text x="335" y="172" text-anchor="middle" class="small">check</text>

  <!-- Result -->
  <rect x="370" y="440" width="490" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="615" y="460" text-anchor="middle" class="check">All checks pass → Chain trusted → Proceed to XMLDSig verification</text>
</svg>
