name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all audience sites
        run: pnpm build

      - name: Copy PKI documentation
        run: |
          mkdir -p apps/cnml-web/dist/docs/pki
          cp -r docs/pki-diagrams apps/cnml-web/dist/docs/pki/
          cp docs/pki-architecture.md apps/cnml-web/dist/docs/pki/
          cp docs/manual-*.md apps/cnml-web/dist/docs/pki/
          cp TODO.cnml-pki/README.md apps/cnml-web/dist/docs/pki/todo.md

      - name: Copy CA server docs
        run: |
          mkdir -p apps/cnml-web/dist/pki-server
          cp -r oiml-pki-server/*.rb oiml-pki-server/Gemfile oiml-pki-server/views oiml-pki-server/public oiml-pki-server/start-ca.command apps/cnml-web/dist/pki-server/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/cnml-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
