name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all audience sites
        run: pnpm build

      # The shell-pin leg (TODO.ia/03): the dependency is an exact npm
      # version and equals npm's latest published release, so a shell
      # release lands here deliberately, never silently.
      - name: The shell pin satisfies the published channel
        working-directory: apps/cnml-web
        run: pnpm run check:shell-pin

      # The nav completeness gate: every href in the injected nav model
      # resolves to a real page in the built tree.
      - name: Nav completeness gate
        working-directory: apps/cnml-web
        run: pnpm run check:nav

      - name: Audit (link integrity, page rendering, asset integrity)
        run: pnpm test:audit

      - name: Test vectors (the verify gate — Pages deploys only from green)
        run: pnpm test

      # The PKI docs and the CA server source are no longer copied
      # into the web app's dist/ (ADR-0001, TODO.cnml/62). They
      # ship as a release tarball via release-ca.yml. The web app
      # links to the GitHub Release for downloads.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/cnml-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
