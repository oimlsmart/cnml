name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (style guide)
        run: pnpm lint:style

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Linter unit tests
        run: pnpm test:lint

      - name: Crypto unit tests (the per-check posture)
        run: pnpm test:crypto

      - name: Web unit tests (markdown-page helper)
        run: pnpm test:web

      - name: Vitest island unit tests
        run: pnpm test:vitest

      - name: Build all audience sites
        run: pnpm build

      - name: Audit (link integrity, page rendering, asset integrity)
        run: pnpm test:audit

      - name: Bundle budget
        run: pnpm budget

      - name: Test vectors (the 65-file corpus + the check postures)
        run: pnpm test

  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: oiml-pki-server

      - name: CA server suite (the confium-native specs skip honestly
          when the binding is absent)
        working-directory: oiml-pki-server
        run: bundle exec rspec

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright suite
        run: pnpm test:e2e
