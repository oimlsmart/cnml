<svg
  viewBox="0 0 280 420"
  class={`cnml-seal ${className}`}
  role="img"
  aria-label="CNML five-tier trust chain from OIML root through IA, manufacturer model, instance certificate, to signed measurements."
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    {/* Drop shadow for depth */}
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.08" />
    </filter>

    {/* Tier gradients — top-left to bottom-right, subtle */}
    <linearGradient id="grad-t1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0a1628" />
    </linearGradient>
    <linearGradient id="grad-t2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004996" />
      <stop offset="100%" stop-color="#003a78" />
    </linearGradient>
    <linearGradient id="grad-t3a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#024873" />
      <stop offset="100%" stop-color="#013a5e" />
    </linearGradient>
    <linearGradient id="grad-t3b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#0c6a82" />
    </linearGradient>
    <linearGradient id="grad-t4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#126d33" />
    </linearGradient>
    <linearGradient id="grad-t5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b8650a" />
    </linearGradient>

    {/* Accent glow */}
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Dark mode: lighten text, increase card opacity */
    .dark .cnml-seal-card rect.card-fill { opacity: 0.25; }
    .dark .cnml-seal-card .card-label { fill: rgba(245, 239, 228, 0.95); }
    .dark .cnml-seal-card .card-sub { fill: rgba(245, 239, 228, 0.6); }
    .dark .cnml-seal-card .card-icon { opacity: 0.5; }
    .dark .cnml-seal-connector { opacity: 0.4; }
    .dark .cnml-seal-tier-badge { opacity: 0.6; }
    /* Light mode defaults */
    .cnml-seal-card rect.card-fill { opacity: 0.12; }
    .cnml-seal-card .card-label { fill: #0a1628; }
    .cnml-seal-card .card-sub { fill: #6b7a92; }
    .cnml-seal-card .card-icon { opacity: 0.35; }
    .cnml-seal-connector { opacity: 0.25; }
    .cnml-seal-tier-badge { opacity: 0.5; }
  </style>

  {/* ─── Connector lines (drawn first, behind cards) ─── */}
  <g class="cnml-seal-connector" fill="none" stroke-width="1.5">
    {/* T1 → T2 */}
    <path d="M 140 64 C 140 72, 140 76, 140 82" stroke="#1e3a5f" />
    {/* T2 → T3a (left, Test Lab) */}
    <path d="M 110 124 C 80 130, 60 134, 48 138" stroke="#024873" stroke-dasharray="3 3" />
    {/* T2 → T3b (right, Manufacturer) */}
    <path d="M 140 124 C 160 132, 175 136, 185 138" stroke="#0e7490" />
    {/* T3b → T4 */}
    <path d="M 185 180 C 185 188, 185 192, 185 198" stroke="#15803d" />
    {/* T4 → T5 */}
    <path d="M 185 240 C 185 248, 185 252, 185 258" stroke="#d97706" />
  </g>

  {/* ─── Tier 1: OIML / BIML Root ─── */}
  <g class="cnml-seal-card" filter="url(#card-shadow)">
    <rect class="card-fill" x="20" y="6" width="240" height="56" rx="10" fill="url(#grad-t1)" />
    <rect x="20" y="6" width="240" height="56" rx="10" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.3" />

    {/* Tier badge */}
    <g class="cnml-seal-tier-badge" transform="translate(36, 20)">
      <circle cx="0" cy="0" r="10" fill="#1e3a5f" />
      <text x="0" y="3.5" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="9" font-weight="700" fill="#f5efe4">1</text>
    </g>

    {/* Icon: sovereign shield */}
    <g class="card-icon" transform="translate(60, 22)" stroke="#1e3a5f" stroke-width="1.2" fill="none">
      <path d="M0,0 L8,-6 L16,0 L16,10 C16,14 12,17 8,18 C4,17 0,14 0,10 Z" />
      <path d="M8,-3 L8,15" stroke-width="0.6" />
    </g>

    {/* Quorum dots */}
    <g transform="translate(200, 22)">
      <circle cx="-24" cy="0" r="3" fill="#d97706" />
      <circle cx="-16" cy="0" r="3" fill="#d97706" />
      <circle cx="-8"  cy="0" r="3" fill="#d97706" />
      <circle cx="0"   cy="0" r="3" fill="#d97706" />
      <circle cx="8"   cy="0" r="3" fill="#d97706" />
      <circle cx="16"  cy="0" r="3" fill="none" stroke="#d97706" stroke-width="1" opacity="0.4" />
      <circle cx="24"  cy="0" r="3" fill="none" stroke="#d97706" stroke-width="1" opacity="0.4" />
      <text x="0" y="16" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="6" fill="#d97706" opacity="0.7">5/7</text>
    </g>

    <text class="card-label" x="86" y="28" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600">OIML / BIML Root</text>
    <text class="card-sub" x="86" y="44" font-family="'IBM Plex Sans', sans-serif" font-size="8">threshold quorum · delegates signing</text>
  </g>

  {/* ─── Tier 2: Issuing Authority ─── */}
  <g class="cnml-seal-card" filter="url(#card-shadow)">
    <rect class="card-fill" x="30" y="82" width="220" height="42" rx="10" fill="url(#grad-t2)" />
    <rect x="30" y="82" width="220" height="42" rx="10" fill="none" stroke="#004996" stroke-width="1" opacity="0.3" />

    <g class="cnml-seal-tier-badge" transform="translate(46, 103)">
      <circle cx="0" cy="0" r="10" fill="#004996" />
      <text x="0" y="3.5" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="9" font-weight="700" fill="#f5efe4">2</text>
    </g>

    {/* Icon: institution columns */}
    <g class="card-icon" transform="translate(70, 94)" stroke="#004996" stroke-width="1" fill="none">
      <path d="M0,2 L10,-4 L20,2 Z" />
      <line x1="3" y1="4" x2="3" y2="14" />
      <line x1="10" y1="4" x2="10" y2="14" />
      <line x1="17" y1="4" x2="17" y2="14" />
      <line x1="0" y1="15" x2="20" y2="15" />
    </g>

    <text class="card-label" x="100" y="103" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="600">Issuing Authority</text>
    <text class="card-sub" x="100" y="116" font-family="'IBM Plex Sans', sans-serif" font-size="7.5">scoped to Recommendations</text>
  </g>

  {/* ─── Tier 3a: Test Lab (left, dashed) ─── */}
  <g class="cnml-seal-card" filter="url(#card-shadow)">
    <rect class="card-fill" x="6" y="138" width="84" height="42" rx="8" fill="url(#grad-t3a)" />
    <rect x="6" y="138" width="84" height="42" rx="8" fill="none" stroke="#024873" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.4" />

    <g class="cnml-seal-tier-badge" transform="translate(20, 159)">
      <circle cx="0" cy="0" r="8" fill="#024873" />
      <text x="0" y="3" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="7.5" font-weight="700" fill="#f5efe4">3</text>
    </g>

    {/* Icon: flask */}
    <g class="card-icon" transform="translate(38, 148)" stroke="#024873" stroke-width="0.8" fill="none">
      <path d="M4,0 L4,4 L0,14 L10,14 L6,4 L6,0 Z" />
      <line x1="3" y1="0" x2="7" y2="0" />
    </g>

    <text class="card-label" x="56" y="159" font-family="'IBM Plex Sans', sans-serif" font-size="8.5" font-weight="600">Test Lab</text>
    <text class="card-sub" x="56" y="171" font-family="'IBM Plex Sans', sans-serif" font-size="6.5">signs reports</text>
  </g>

  {/* ─── Tier 3b: Manufacturer Model (right) ─── */}
  <g class="cnml-seal-card" filter="url(#card-shadow)">
    <rect class="card-fill" x="100" y="138" width="170" height="42" rx="8" fill="url(#grad-t3b)" />
    <rect x="100" y="138" width="170" height="42" rx="8" fill="none" stroke="#0e7490" stroke-width="1" opacity="0.3" />

    <g class="cnml-seal-tier-badge" transform="translate(116, 159)">
      <circle cx="0" cy="0" r="8" fill="#0e7490" />
      <text x="0" y="3" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="7.5" font-weight="700" fill="#f5efe4">3</text>
    </g>

    {/* Icon: gear */}
    <g class="card-icon" transform="translate(134, 150)" stroke="#0e7490" stroke-width="0.8" fill="none">
      <circle cx="7" cy="7" r="3" />
      <path d="M7,2 L7,4 M7,10 L7,12 M2,7 L4,7 M10,7 L12,7 M3.5,3.5 L5,5 M9,9 L10.5,10.5 M3.5,10.5 L5,9 M9,5 L10.5,3.5" />
    </g>

    <text class="card-label" x="154" y="159" font-family="'IBM Plex Sans', sans-serif" font-size="9" font-weight="600">Manufacturer Model</text>
    <text class="card-sub" x="154" y="171" font-family="'IBM Plex Sans', sans-serif" font-size="6.5">delegated signing key</text>
  </g>

  {/* ─── Tier 4: Instance Certificate ─── */}
  <g class="cnml-seal-card" filter="url(#card-shadow)">
    <rect class="card-fill" x="80" y="198" width="210" height="42" rx="8" fill="url(#grad-t4)" />
    <rect x="80" y="198" width="210" height="42" rx="8" fill="none" stroke="#15803d" stroke-width="1" opacity="0.3" />

    <g class="cnml-seal-tier-badge" transform="translate(96, 219)">
      <circle cx="0" cy="0" r="8" fill="#15803d" />
      <text x="0" y="3" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="7.5" font-weight="700" fill="#f5efe4">4</text>
    </g>

    {/* Icon: chip */}
    <g class="card-icon" transform="translate(114, 208)" stroke="#15803d" stroke-width="0.8" fill="none">
      <rect x="2" y="2" width="10" height="10" rx="1.5" />
      <line x1="5" y1="0" x2="5" y2="2" /><line x1="9" y1="0" x2="9" y2="2" />
      <line x1="5" y1="12" x2="5" y2="14" /><line x1="9" y1="12" x2="9" y2="14" />
      <line x1="0" y1="5" x2="2" y2="5" /><line x1="0" y1="9" x2="2" y2="9" />
      <line x1="12" y1="5" x2="14" y2="5" /><line x1="12" y1="9" x2="14" y2="9" />
    </g>

    <text class="card-label" x="136" y="219" font-family="'IBM Plex Sans', sans-serif" font-size="9.5" font-weight="600">Instance Certificate</text>
    <text class="card-sub" x="136" y="231" font-family="'IBM Plex Sans', sans-serif" font-size="6.5">serial · firmware · calibration</text>
  </g>

  {/* ─── Tier 5: Signed Measurements ─── */}
  <g class="cnml-seal-card" filter="url(#card-shadow)">
    <rect class="card-fill" x="60" y="258" width="250" height="48" rx="10" fill="url(#grad-t5)" />
    <rect x="60" y="258" width="250" height="48" rx="10" fill="none" stroke="#d97706" stroke-width="1" opacity="0.3" />

    <g class="cnml-seal-tier-badge" transform="translate(76, 282)">
      <circle cx="0" cy="0" r="9" fill="#d97706" />
      <text x="0" y="3.5" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="8.5" font-weight="700" fill="#f5efe4">5</text>
    </g>

    {/* Icon: waveform */}
    <g class="card-icon" transform="translate(94, 274)" stroke="#d97706" stroke-width="1" fill="none">
      <path d="M0,8 L3,8 L5,3 L8,13 L11,5 L14,8 L18,8" />
    </g>

    <text class="card-label" x="118" y="280" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="600">Signed Measurements</text>
    <text class="card-sub" x="118" y="294" font-family="'IBM Plex Sans', sans-serif" font-size="7">value · timestamp · conditions · signature</text>
  </g>

  {/* ─── OpenTimestamps anchor ─── */}
  <g transform="translate(245, 320)" opacity="0.5">
    <rect x="-16" y="-8" width="32" height="16" rx="4" fill="none" stroke="#d97706" stroke-width="0.8" />
    <text x="0" y="2" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="6" fill="#d97706">OTS → ₿</text>
    <path d="M 0 8 L 0 16" stroke="#d97706" stroke-width="0.6" fill="none" stroke-dasharray="1 2" />
  </g>

  {/* ─── Certified Tester credential (side branch) ─── */}
  <g transform="translate(6, 105)" opacity="0.6">
    <path d="M 0 0 C -6 0 -6 10 -6 20 L -6 40" stroke="#024873" stroke-width="0.6" fill="none" stroke-dasharray="2 2" />
    <rect x="-22" y="40" width="24" height="28" rx="4" fill="none" stroke="#024873" stroke-width="0.6" stroke-dasharray="2 2" />
    <text x="-10" y="54" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="5" font-weight="600" fill="#024873">Cert'd</text>
    <text x="-10" y="61" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="5" font-weight="600" fill="#024873">Tester</text>
  </g>

  {/* ─── Tier labels (right margin) ─── */}
  <g font-family="'IBM Plex Mono', monospace" font-size="5.5" letter-spacing="0.5" opacity="0.25">
    <text x="270" y="36" text-anchor="end">T1 ROOT</text>
    <text x="270" y="107" text-anchor="end">T2 IA</text>
    <text x="270" y="162" text-anchor="end">T3 MODEL</text>
    <text x="270" y="222" text-anchor="end">T4 DEVICE</text>
    <text x="270" y="286" text-anchor="end">T5 MEASURE</text>
  </g>
</svg>
