<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, system-ui, sans-serif" font-size="13" fill="currentColor">
  <title>CNML Signing Flow</title>
  <desc>Steps from form builder to downloadable signed CNML file. Private key never leaves the browser.</desc>

  <defs>
    <style>
      .box    { fill: #f8fafc; stroke: #cbd5e1; }
      .sign   { fill: #fefce8; stroke: #fde047; }
      .out    { fill: #f0fdf4; stroke: #86efac; }
      .key    { fill: #fef2f2; stroke: #fca5a5; }
      .arrow  { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arr3); }
      .label  { fill: #0f172a; }
      .muted  { fill: #64748b; font-size: 11px; }
      .step   { fill: #1d4ed8; font-weight: 700; }
    </style>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" class="label">CNML Signing Flow</text>
  <text x="450" y="50" text-anchor="middle" class="muted">All steps happen in the browser. Private key never leaves the device.</text>

  <!-- Step 1 -->
  <g>
    <circle cx="80" cy="130" r="18" fill="#1d4ed8"/>
    <text x="80" y="135" text-anchor="middle" font-weight="700" fill="white">1</text>
    <rect x="110" y="100" width="180" height="60" rx="8" class="box"/>
    <text x="200" y="125" text-anchor="middle" font-weight="700" class="label">Form Builder</text>
    <text x="200" y="145" text-anchor="middle" class="muted">Vue island · JSON Schema</text>
  </g>

  <!-- Step 2 -->
  <g>
    <circle cx="380" cy="130" r="18" fill="#1d4ed8"/>
    <text x="380" y="135" text-anchor="middle" font-weight="700" fill="white">2</text>
    <rect x="410" y="100" width="180" height="60" rx="8" class="box"/>
    <text x="500" y="125" text-anchor="middle" font-weight="700" class="label">Build cert object</text>
    <text x="500" y="145" text-anchor="middle" class="muted">TypeScript-typed</text>
  </g>

  <!-- Step 3 -->
  <g>
    <circle cx="680" cy="130" r="18" fill="#1d4ed8"/>
    <text x="680" y="135" text-anchor="middle" font-weight="700" fill="white">3</text>
    <rect x="100" y="200" width="180" height="60" rx="8" class="box"/>
    <text x="190" y="225" text-anchor="middle" font-weight="700" class="label">Serialize to XML</text>
    <text x="190" y="245" text-anchor="middle" class="muted">@oimlsmart/cnml-xml</text>
  </g>

  <!-- Step 4 -->
  <g>
    <rect x="380" y="200" width="180" height="60" rx="8" class="sign"/>
    <text x="470" y="225" text-anchor="middle" font-weight="700" class="label">Sign with key</text>
    <text x="470" y="245" text-anchor="middle" class="muted">xmldsigjs · SHA-256</text>
    <circle cx="370" cy="230" r="18" fill="#1d4ed8"/>
    <text x="370" y="235" text-anchor="middle" font-weight="700" fill="white">4</text>
  </g>

  <!-- Step 5 -->
  <g>
    <rect x="660" y="200" width="180" height="60" rx="8" class="out"/>
    <text x="750" y="225" text-anchor="middle" font-weight="700" class="label">Embed &amp; download</text>
    <text x="750" y="245" text-anchor="middle" class="muted">&lt;ds:Signature/&gt; in CNML</text>
    <circle cx="650" cy="230" r="18" fill="#1d4ed8"/>
    <text x="650" y="235" text-anchor="middle" font-weight="700" fill="white">5</text>
  </g>

  <!-- Private key (held by user) -->
  <g>
    <rect x="380" y="320" width="180" height="60" rx="8" class="key"/>
    <text x="470" y="345" text-anchor="middle" font-weight="700" class="label">Private key</text>
    <text x="470" y="365" text-anchor="middle" class="muted">IndexedDB · encrypted</text>
  </g>

  <!-- Output file -->
  <g>
    <rect x="660" y="320" width="180" height="60" rx="8" class="out"/>
    <text x="750" y="345" text-anchor="middle" font-weight="700" class="label">*.cnml.xml</text>
    <text x="750" y="365" text-anchor="middle" class="muted">Signed certificate</text>
  </g>

  <!-- Arrows -->
  <path d="M 290 130 L 360 130" class="arrow"/>
  <path d="M 590 130 L 660 130 L 660 200" class="arrow" stroke-dasharray="3,3"/>
  <path d="M 200 160 L 200 200" class="arrow"/>
  <path d="M 280 230 L 370 230" class="arrow"/>
  <path d="M 560 230 L 650 230" class="arrow"/>

  <!-- Private key feed into signing -->
  <path d="M 470 320 L 470 260" class="arrow" stroke-dasharray="2,2"/>
  <text x="480" y="295" class="muted">uses</text>

  <!-- Output feed from step 5 -->
  <path d="M 750 260 L 750 320" class="arrow"/>

  <!-- Annotation -->
  <text x="450" y="430" text-anchor="middle" class="muted">XMLDSig enveloped signature · C14N Exclusive canonicalization · X.509 cert in &lt;ds:KeyInfo&gt;</text>
</svg>
