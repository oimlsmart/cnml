<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="IBM Plex Sans, system-ui, sans-serif">
  <style>
    .h1 { font-size: 22px; font-weight: 600; fill: #0a1628; }
    .h2 { font-size: 16px; font-weight: 600; fill: #004996; }
    .lbl { font-size: 12px; fill: #0a1628; }
    .lbl-sm { font-size: 11px; fill: #3a4a63; }
    .note { font-size: 11px; fill: #6b7a92; font-style: italic; }
    .lbl-mono { font-size: 11px; fill: #004996; font-family: IBM Plex Mono, monospace; }
    .box-tls { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1.5; }
    .box-cnml { fill: #FAF6EE; stroke: #004996; stroke-width: 1.5; }
    .box-scope-ok { fill: #F0FDF4; stroke: #15803D; stroke-width: 1.5; }
    .box-scope-no { fill: #FEF2F2; stroke: #B91C1C; stroke-width: 1.5; }
  </style>

  <text x="600" y="32" text-anchor="middle" class="h1">Authorization scope: typical TLS vs CNML</text>
  <text x="600" y="52" text-anchor="middle" class="note">Who can sign what? CNML enforces this cryptographically; typical PKI doesn't.</text>

  <!-- ============ TLS side ============ -->
  <text x="300" y="100" text-anchor="middle" class="h2">Typical TLS — any CA can issue for any domain</text>

  <g transform="translate(60,120)">
    <!-- Root -->
    <rect x="120" y="0" width="240" height="50" rx="6" class="box-tls"/>
    <text x="240" y="22" text-anchor="middle" class="lbl">DigiCert Root</text>
    <text x="240" y="38" text-anchor="middle" class="lbl-sm">(browser root store)</text>

    <!-- Intermediate -->
    <rect x="120" y="80" width="240" height="50" rx="6" class="box-tls"/>
    <text x="240" y="102" text-anchor="middle" class="lbl">DigiCert Intermediate</text>
    <text x="240" y="118" text-anchor="middle" class="lbl-sm">no scope restriction</text>

    <line x1="240" y1="50" x2="240" y2="80" stroke="#9CA3AF" stroke-width="1.5"/>

    <!-- Three example domains -->
    <rect x="0" y="170" width="100" height="50" rx="6" class="box-tls"/>
    <text x="50" y="192" text-anchor="middle" class="lbl-mono">google.com</text>
    <text x="50" y="208" text-anchor="middle" class="lbl-sm">OK</text>

    <rect x="190" y="170" width="100" height="50" rx="6" class="box-tls"/>
    <text x="240" y="192" text-anchor="middle" class="lbl-mono">bank.com</text>
    <text x="240" y="208" text-anchor="middle" class="lbl-sm">OK</text>

    <rect x="380" y="170" width="100" height="50" rx="6" class="box-tls"/>
    <text x="430" y="192" text-anchor="middle" class="lbl-mono">gov.uk</text>
    <text x="430" y="208" text-anchor="middle" class="lbl-sm">OK</text>

    <line x1="50" y1="130" x2="50" y2="170" stroke="#9CA3AF" stroke-width="1.5"/>
    <line x1="240" y1="130" x2="240" y2="170" stroke="#9CA3AF" stroke-width="1.5"/>
    <line x1="430" y1="130" x2="430" y2="170" stroke="#9CA3AF" stroke-width="1.5"/>

    <!-- 2nd root -->
    <rect x="120" y="260" width="240" height="50" rx="6" class="box-tls"/>
    <text x="240" y="282" text-anchor="middle" class="lbl">Let's Encrypt Root</text>
    <text x="240" y="298" text-anchor="middle" class="lbl-sm">also browser-trusted</text>

    <rect x="0" y="340" width="480" height="50" rx="6" class="box-tls"/>
    <text x="240" y="362" text-anchor="middle" class="lbl-sm">…can also issue for any of these domains</text>
    <text x="240" y="378" text-anchor="middle" class="lbl-sm">(any root can sign any domain — no scoping)</text>

    <line x1="240" y1="310" x2="240" y2="340" stroke="#9CA3AF" stroke-width="1.5"/>
  </g>

  <text x="300" y="490" text-anchor="middle" class="note">Trust comes from the root. Authorization scope is implicit (everything).</text>

  <!-- ============ CNML side ============ -->
  <text x="900" y="100" text-anchor="middle" class="h2">CNML — scope is cryptographically enforced</text>

  <g transform="translate(660,120)">
    <!-- Root -->
    <rect x="120" y="0" width="240" height="50" rx="6" class="box-cnml"/>
    <text x="240" y="22" text-anchor="middle" class="lbl">OIML Root CA</text>
    <text x="240" y="38" text-anchor="middle" class="lbl-sm">(BIML-controlled, air-gapped)</text>

    <!-- Intermediate NMi -->
    <rect x="0" y="80" width="220" height="60" rx="6" class="box-cnml"/>
    <text x="110" y="100" text-anchor="middle" class="lbl">NMi Intermediate (NL1)</text>
    <text x="110" y="116" text-anchor="middle" class="lbl-sm">scope:</text>
    <text x="110" y="132" text-anchor="middle" class="lbl-mono">R76, R60, R117</text>

    <!-- Intermediate PTB -->
    <rect x="260" y="80" width="220" height="60" rx="6" class="box-cnml"/>
    <text x="370" y="100" text-anchor="middle" class="lbl">PTB Intermediate (DE1)</text>
    <text x="370" y="116" text-anchor="middle" class="lbl-sm">scope:</text>
    <text x="370" y="132" text-anchor="middle" class="lbl-mono">R60, R76, R111</text>

    <line x1="110" y1="50" x2="110" y2="80" stroke="#004996" stroke-width="1.5"/>
    <line x1="370" y1="50" x2="370" y2="80" stroke="#004996" stroke-width="1.5"/>

    <!-- NMi-signed certs -->
    <rect x="0" y="170" width="100" height="50" rx="6" class="box-scope-ok"/>
    <text x="50" y="192" text-anchor="middle" class="lbl-mono">R76 cert</text>
    <text x="50" y="208" text-anchor="middle" class="lbl-sm">✓ in scope</text>

    <rect x="120" y="170" width="100" height="50" rx="6" class="box-scope-ok"/>
    <text x="170" y="192" text-anchor="middle" class="lbl-mono">R117 cert</text>
    <text x="170" y="208" text-anchor="middle" class="lbl-sm">✓ in scope</text>

    <line x1="50" y1="140" x2="50" y2="170" stroke="#15803D" stroke-width="1.5"/>
    <line x1="170" y1="140" x2="170" y2="170" stroke="#15803D" stroke-width="1.5"/>

    <!-- PTB out-of-scope attempt -->
    <rect x="260" y="170" width="100" height="50" rx="6" class="box-scope-ok"/>
    <text x="310" y="192" text-anchor="middle" class="lbl-mono">R60 cert</text>
    <text x="310" y="208" text-anchor="middle" class="lbl-sm">✓ in scope</text>

    <rect x="380" y="170" width="100" height="50" rx="6" class="box-scope-no"/>
    <text x="430" y="192" text-anchor="middle" class="lbl-mono">R117 cert</text>
    <text x="430" y="208" text-anchor="middle" class="lbl-sm">✗ REJECTED</text>

    <line x1="310" y1="140" x2="310" y2="170" stroke="#15803D" stroke-width="1.5"/>
    <line x1="430" y1="140" x2="430" y2="170" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="4 3"/>

    <text x="430" y="240" text-anchor="middle" class="note">PTB not authorized for R117</text>
    <text x="430" y="255" text-anchor="middle" class="note">(no DoMC recognition for fuel dispensers)</text>

    <!-- Verifier check -->
    <rect x="120" y="280" width="240" height="80" rx="6" fill="#DBEAF3" stroke="#004996" stroke-width="1.5"/>
    <text x="240" y="302" text-anchor="middle" class="lbl">Verifier reads intermediate cert</text>
    <text x="240" y="320" text-anchor="middle" class="lbl-sm">oimlAuthorizedRecommendations</text>
    <text x="240" y="336" text-anchor="middle" class="lbl-sm">extension → JSON list of R-ids</text>
    <text x="240" y="352" text-anchor="middle" class="lbl-sm">→ reject if cert's R-id isn't covered</text>
  </g>

  <text x="900" y="490" text-anchor="middle" class="note">Scope is enforced at verify time. Forged out-of-scope cert fails verification.</text>
</svg>
