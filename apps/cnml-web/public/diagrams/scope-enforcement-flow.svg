<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" text-rendering="geometricPrecision">
  <title>BIML scope enforcement flow</title>
  <desc>The four enforcement layers of BIML scope governance, from BIML writing scope to the IA intermediate certificate, through the IA refusing out-of-scope end-entity issuance, through the signer browser checking scope, to the verifier rejecting scope mismatches.</desc>

  <defs>
    <marker id="arrow-se" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c566a"/>
    </marker>
    <marker id="arrow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf616a"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #f9fafb; }
    .frame { fill: none; stroke: #d8dee9; stroke-width: 1; }
    .layer-box { fill: #e5e9f0; stroke: #4c566a; stroke-width: 1.25; rx: 8; }
    .layer-num { fill: #5e81ac; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; }
    .layer-title { fill: #2e3440; font-weight: 600; font-size: 14px; }
    .layer-actor { fill: #4c566a; font-size: 12px; }
    .layer-action { fill: #3b4252; font-size: 12px; }
    .reject-box { fill: #fff; stroke: #bf616a; stroke-width: 1.5; rx: 6; }
    .reject-title { fill: #bf616a; font-weight: 600; font-size: 12px; }
    .flow-line { stroke: #4c566a; stroke-width: 1.5; fill: none; }
    .reject-line { stroke: #bf616a; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .section-label { font-weight: 600; font-size: 11px; fill: #6b7280; letter-spacing: 0.08em; text-transform: uppercase; }
    .caption { font-size: 12px; fill: #4c566a; }
  </style>

  <rect class="bg" x="0" y="0" width="640" height="560"/>
  <rect class="frame" x="0.5" y="0.5" width="639" height="559"/>

  <text x="40" y="34" class="section-label">Scope enforcement is layered</text>

  <g transform="translate(40, 60)">
    <rect class="layer-box" x="0" y="0" width="540" height="80" rx="8"/>
    <text x="20" y="28" class="layer-num">LAYER 1</text>
    <text x="20" y="52" class="layer-title">BIML writes scope to IA certificate</text>
    <text x="20" y="70" class="layer-actor">BIML root quorum signs the IA intermediate cert with</text>
    <text x="20" y="86" class="layer-actor">the oimlAuthorizedRecommendations X.509 v3 extension.</text>
  </g>

  <path class="flow-line" d="M 310,140 L 310,160" marker-end="url(#arrow-se)"/>

  <g transform="translate(40, 160)">
    <rect class="layer-box" x="0" y="0" width="540" height="80" rx="8"/>
    <text x="20" y="28" class="layer-num">LAYER 2</text>
    <text x="20" y="52" class="layer-title">IA refuses out-of-scope end-entity issuance</text>
    <text x="20" y="70" class="layer-actor">The IA signing infrastructure checks the requested</text>
    <text x="20" y="86" class="layer-actor">Recommendation against the IA's authorized scope.</text>
  </g>

  <path class="flow-line" d="M 310,240 L 310,260" marker-end="url(#arrow-se)"/>

  <g transform="translate(40, 260)">
    <rect class="layer-box" x="0" y="0" width="540" height="80" rx="8"/>
    <text x="20" y="28" class="layer-num">LAYER 3</text>
    <text x="20" y="52" class="layer-title">Signer browser checks scope before signing</text>
    <text x="20" y="70" class="layer-actor">The browser signing app validates the requested scope</text>
    <text x="20" y="86" class="layer-actor">against the end-entity cert before producing a signature.</text>
  </g>

  <path class="flow-line" d="M 310,340 L 310,360" marker-end="url(#arrow-se)"/>

  <g transform="translate(40, 360)">
    <rect class="layer-box" x="0" y="0" width="540" height="80" rx="8"/>
    <text x="20" y="28" class="layer-num">LAYER 4</text>
    <text x="20" y="52" class="layer-title">Verifier rejects scope mismatches</text>
    <text x="20" y="70" class="layer-actor">Any verifier reconstructs the IA scope from the chain</text>
    <text x="20" y="86" class="layer-actor">and rejects any CNML whose Recommendation is not listed.</text>
  </g>

  <g transform="translate(40, 470)">
    <rect class="reject-box" x="0" y="0" width="540" height="60" rx="6"/>
    <text x="20" y="26" class="reject-title">Out-of-scope certificate rejected</text>
    <text x="20" y="46" class="caption">An IA scoped to R60 and R76 cannot produce a valid R117 certificate. The verifier rejects the scope mismatch at the verify step.</text>
  </g>
</svg>
