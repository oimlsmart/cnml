<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" text-rendering="geometricPrecision">
  <title>Redundancy and fault tolerance</title>
  <desc>A matrix of failure modes (director loss, officer loss, hardware-key loss, CA-machine loss, coordinator loss, CDN outage, transparency log divergence) showing the blast radius, the recovery mechanism, and the recovery time for each.</desc>

  <defs>
    <marker id="arrow-rf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c566a"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #f9fafb; }
    .frame { fill: none; stroke: #d8dee9; stroke-width: 1; }
    .col-header { fill: #4c566a; font-weight: 600; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
    .row-header { fill: #2e3440; font-weight: 600; font-size: 13px; }
    .cell { font-size: 12px; fill: #3b4252; }
    .cell-emph { font-size: 12px; fill: #3b4252; font-weight: 500; }
    .status-intact { fill: #a3be8c; font-weight: 600; font-size: 11px; }
    .status-recover { fill: #d08770; font-weight: 600; font-size: 11px; }
    .section-label { font-weight: 600; font-size: 11px; fill: #6b7280; letter-spacing: 0.08em; text-transform: uppercase; }
    .grid { stroke: #d8dee9; stroke-width: 1; fill: none; }
    .grid-strong { stroke: #4c566a; stroke-width: 1.25; fill: none; }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="560"/>
  <rect class="frame" x="0.5" y="0.5" width="899" height="559"/>

  <text x="40" y="34" class="section-label">Continuity of operations under component loss</text>

  <g transform="translate(40, 70)">
    <text x="0" y="0" class="col-header">Failure scenario</text>
    <text x="260" y="0" class="col-header">Blast radius</text>
    <text x="500" y="0" class="col-header">Recovery mechanism</text>
    <text x="760" y="0" class="col-header">Recovery time</text>

    <line x1="0" y1="12" x2="820" y2="12" class="grid-strong"/>

    <g transform="translate(0, 36)">
      <text x="0" y="0" class="row-header">Director loss</text>
      <text x="260" y="0" class="cell">One director share offline</text>
      <text x="500" y="0" class="cell-emph">Quorum continues with T-of-(N-1)</text>
      <text x="760" y="0" class="status-intact">No impact</text>
    </g>
    <line x1="0" y1="56" x2="820" y2="56" class="grid"/>

    <g transform="translate(0, 80)">
      <text x="0" y="0" class="row-header">Multiple director losses</text>
      <text x="260" y="0" class="cell">Fewer than T directors remain</text>
      <text x="500" y="0" class="cell-emph">Emergency re-sharing adds new directors</text>
      <text x="760" y="0" class="status-recover">Days to weeks</text>
    </g>
    <line x1="0" y1="100" x2="820" y2="100" class="grid"/>

    <g transform="translate(0, 124)">
      <text x="0" y="0" class="row-header">IA officer loss</text>
      <text x="260" y="0" class="cell">One IA officer share offline</text>
      <text x="500" y="0" class="cell-emph">IA quorum continues with remaining officers</text>
      <text x="760" y="0" class="status-intact">No impact</text>
    </g>
    <line x1="0" y1="144" x2="820" y2="144" class="grid"/>

    <g transform="translate(0, 168)">
      <text x="0" y="0" class="row-header">Hardware key loss</text>
      <text x="260" y="0" class="cell">One YubiKey or HSM unavailable</text>
      <text x="500" y="0" class="cell-emph">Backup device provisioned in advance</text>
      <text x="760" y="0" class="status-recover">Hours</text>
    </g>
    <line x1="0" y1="188" x2="820" y2="188" class="grid"/>

    <g transform="translate(0, 212)">
      <text x="0" y="0" class="row-header">CA machine loss</text>
      <text x="260" y="0" class="cell">Air-gapped CA laptop destroyed</text>
      <text x="500" y="0" class="cell-emph">Rebuild from encrypted backup at second facility</text>
      <text x="760" y="0" class="status-recover">Days</text>
    </g>
    <line x1="0" y1="232" x2="820" y2="232" class="grid"/>

    <g transform="translate(0, 256)">
      <text x="0" y="0" class="row-header">Coordinator service failure</text>
      <text x="260" y="0" class="cell">Coordinator unavailable</text>
      <text x="500" y="0" class="cell-emph">Hot standby at second BIML facility</text>
      <text x="760" y="0" class="status-recover">Minutes to hours</text>
    </g>
    <line x1="0" y1="276" x2="820" y2="276" class="grid"/>

    <g transform="translate(0, 300)">
      <text x="0" y="0" class="row-header">CDN outage</text>
      <text x="260" y="0" class="cell">Public trust-anchor distribution interrupted</text>
      <text x="500" y="0" class="cell-emph">Verifiers operate from cached trust-anchor bundle</text>
      <text x="760" y="0" class="status-intact">No impact offline</text>
    </g>
    <line x1="0" y1="320" x2="820" y2="320" class="grid"/>

    <g transform="translate(0, 344)">
      <text x="0" y="0" class="row-header">Transparency log divergence</text>
      <text x="260" y="0" class="cell">Mirror presents different view</text>
      <text x="500" y="0" class="cell-emph">Gossip reconciliation across mirrors</text>
      <text x="760" y="0" class="status-recover">Hours</text>
    </g>
    <line x1="0" y1="364" x2="820" y2="364" class="grid-strong"/>

    <g transform="translate(0, 388)">
      <text x="0" y="0" class="row-header">Manufacturer key loss</text>
      <text x="260" y="0" class="cell">Manufacturer signing key unavailable</text>
      <text x="500" y="0" class="cell-emph">Threshold escrow recovers via issuing IA quorum</text>
      <text x="760" y="0" class="status-recover">Hours</text>
    </g>
  </g>

  <g transform="translate(40, 510)">
    <text x="0" y="0" class="cell">The aggregate public key at the BIML Root and IA Intermediate tiers is preserved across re-sharing. All previously issued certificates remain valid without modification after director rotation, officer rotation, or hardware replacement.</text>
    <text x="0" y="20" class="cell">Loss scenarios that affect one party produce no forged signatures. Loss scenarios that drop below the threshold require re-sharing, which preserves the public key.</text>
  </g>
</svg>
