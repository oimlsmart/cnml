<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, system-ui, sans-serif" font-size="13" fill="currentColor">
  <title>CNML Verification Flow</title>
  <desc>Steps to verify a signed CNML file: well-formed → schema → signature → trust chain.</desc>

  <defs>
    <style>
      .box    { fill: #f8fafc; stroke: #cbd5e1; }
      .pass   { fill: #f0fdf4; stroke: #86efac; }
      .fail   { fill: #fef2f2; stroke: #fca5a5; }
      .warn   { fill: #fffbeb; stroke: #fde047; }
      .arrow  { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arr4); }
      .label  { fill: #0f172a; }
      .muted  { fill: #64748b; font-size: 11px; }
      .green  { fill: #15803d; font-weight: 700; }
      .red    { fill: #b91c1c; font-weight: 700; }
    </style>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" class="label">CNML Verification Flow</text>
  <text x="450" y="50" text-anchor="middle" class="muted">Four checks, each can short-circuit on failure</text>

  <!-- Upload -->
  <g>
    <rect x="60" y="80" width="160" height="80" rx="10" class="box"/>
    <text x="140" y="110" text-anchor="middle" font-weight="700" class="label">Upload</text>
    <text x="140" y="130" text-anchor="middle" class="muted">*.cnml.xml</text>
    <text x="140" y="146" text-anchor="middle" class="muted">(drag-drop or browse)</text>
  </g>

  <!-- Step 1: Well-formed XML -->
  <g>
    <rect x="280" y="80" width="180" height="80" rx="10" class="box"/>
    <text x="370" y="110" text-anchor="middle" font-weight="700" class="label">1. XML well-formed?</text>
    <text x="370" y="130" text-anchor="middle" class="muted">DOMParser</text>
    <text x="370" y="146" text-anchor="middle" class="muted">no parser errors</text>
  </g>
  <path d="M 220 120 L 280 120" class="arrow"/>

  <!-- Pass / Fail -->
  <text x="490" y="100" class="green">✓ pass →</text>
  <text x="490" y="135" class="red">✗ fail: malformed</text>

  <!-- Step 2: Schema -->
  <g>
    <rect x="280" y="190" width="180" height="80" rx="10" class="box"/>
    <text x="370" y="220" text-anchor="middle" font-weight="700" class="label">2. Schema valid?</text>
    <text x="370" y="240" text-anchor="middle" class="muted">XSD 1.0 (cnml-1.0.xsd)</text>
    <text x="370" y="256" text-anchor="middle" class="muted">+ per-R schema if referenced</text>
  </g>
  <path d="M 370 160 L 370 190" class="arrow"/>
  <text x="490" y="210" class="green">✓ pass →</text>
  <text x="490" y="245" class="red">✗ fail: schema errors</text>

  <!-- Step 3: Signature -->
  <g>
    <rect x="280" y="300" width="180" height="80" rx="10" class="box"/>
    <text x="370" y="330" text-anchor="middle" font-weight="700" class="label">3. Signature valid?</text>
    <text x="370" y="350" text-anchor="middle" class="muted">XMLDSig (xmldsigjs)</text>
    <text x="370" y="366" text-anchor="middle" class="muted">C14N · SHA-256</text>
  </g>
  <path d="M 370 270 L 370 300" class="arrow"/>
  <text x="490" y="320" class="green">✓ pass →</text>
  <text x="490" y="355" class="red">✗ fail: tampered or unsigned</text>

  <!-- Step 4: Trust -->
  <g>
    <rect x="280" y="410" width="180" height="60" rx="10" class="warn"/>
    <text x="370" y="435" text-anchor="middle" font-weight="700" class="label">4. Issuer trusted?</text>
    <text x="370" y="455" text-anchor="middle" class="muted">against user trust store</text>
  </g>
  <path d="M 370 380 L 370 410" class="arrow"/>

  <!-- Result panel -->
  <g>
    <rect x="600" y="190" width="240" height="280" rx="10" class="pass"/>
    <text x="720" y="220" text-anchor="middle" font-weight="700" class="label">Result</text>

    <text x="620" y="250" class="muted">✓ XML well-formed</text>
    <text x="620" y="270" class="muted">✓ Schema valid</text>
    <text x="620" y="290" class="muted">✓ Signature valid</text>
    <text x="620" y="310" class="muted">⚠ Issuer unknown</text>

    <line x1="620" y1="325" x2="820" y2="325" stroke="#86efac"/>
    <text x="620" y="350" class="muted">Certificate details:</text>
    <text x="620" y="370" class="muted">  R60/2021-A-IA01-26.12</text>
    <text x="620" y="390" class="muted">  Issued: 2026-07-02</text>
    <text x="620" y="410" class="muted">  Issuer: Issuing Authority B</text>
    <text x="620" y="430" class="muted">  Recommendation: R60 (load cells)</text>
    <text x="620" y="450" class="muted">  Accuracy: C</text>
  </g>

  <path d="M 470 230 Q 530 230 600 230" class="arrow"/>
  <text x="540" y="220" class="muted">render</text>
</svg>
